<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Global Smart Hub</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#007bff">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/192/865/865969.png">

  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 1rem; user-select: none; }
    .card { background: #fff; width: 100%; max-width: 380px; padding: 2rem; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; }
    .badge { display: inline-block; padding: 4px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: bold; margin-bottom: 1rem; }
    .online { background: #d4edda; color: #155724; }
    .offline { background: #f8d7da; color: #721c24; }
    .role-badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: bold; background: #e9ecef; }
    .master-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 1.2rem; }
    .btn-m-on { background: #28a745; color: #fff; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; }
    .btn-m-off { background: #dc3545; color: #fff; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; }
    .relay-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .relay-box { background: #f8f9fa; border: 1px solid #e9ecef; border-radius: 10px; padding: 1rem; }
    .relay-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .relay-title { font-weight: bold; font-size: 0.9rem; }
    .btn-lock { background: transparent; border: none; font-size: 0.95rem; cursor: pointer; }
    .btn { width: 100%; padding: 10px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; font-size: 0.95rem; }
    .btn-off { background: #6c757d; color: #fff; }
    .btn-on { background: #007bff; color: #fff; }
    .btn-locked { background: #ced4da; color: #6c757d; cursor: not-allowed; }
    .btn-wait { background: #ffc107; color: #000; cursor: wait; }
    #login-view input { width: 100%; padding: 14px; margin: 12px 0; border: 1px solid #ccc; border-radius: 8px; font-size: 1rem; }
    #login-view button { width: 100%; padding: 14px; background: #007bff; color: #fff; border: none; border-radius: 8px; font-size: 1rem; font-weight: bold; cursor: pointer; }
    .error-text { color: #dc3545; font-size: 0.85rem; margin-top: 8px; display: none; }
  </style>
</head>
<body>

  <div class="card">
    <div id="login-view">
      <h2>🔐 Secure Cloud Panel</h2>
      <p style="color:#666; font-size:0.9rem;">Enter Admin or Guest passcode.</p>
      <input type="password" id="pass-input" placeholder="Enter Passcode" onkeydown="if(event.key === 'Enter') handleLogin()">
      <button onclick="handleLogin()">Login</button>
      <div id="login-error" class="error-text">Invalid Passcode!</div>
    </div>

    <div id="dashboard-view" style="display: none;">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <span id="hub-status" class="badge offline">Connecting...</span>
        <div>
          <span id="user-role" class="role-badge">Admin</span>
          <button onclick="handleLogout()" style="background:none; border:none; color:#dc3545; cursor:pointer; font-size:0.85rem;">Logout</button>
        </div>
      </div>

      <h2>Smart Hybrid Hub</h2>

      <div id="admin-master" class="master-grid">
        <button class="btn-m-on" onclick="sendCmd('ALL_ON')">ALL ON</button>
        <button class="btn-m-off" onclick="sendCmd('ALL_OFF')">ALL OFF</button>
      </div>

      <div class="relay-grid">
        <div class="relay-box">
          <div class="relay-header">
            <span class="relay-title">💡 Light</span>
            <button id="lock-icon-0" class="btn-lock" onclick="toggleLock(0)">🔓</button>
          </div>
          <button id="btn-0" class="btn btn-off" onclick="toggle(0)">OFF</button>
        </div>
        <div class="relay-box">
          <div class="relay-header">
            <span class="relay-title">🌀 Fan</span>
            <button id="lock-icon-1" class="btn-lock" onclick="toggleLock(1)">🔓</button>
          </div>
          <button id="btn-1" class="btn btn-off" onclick="toggle(1)">OFF</button>
        </div>
        <div class="relay-box">
          <div class="relay-header">
            <span class="relay-title">📺 TV</span>
            <button id="lock-icon-2" class="btn-lock" onclick="toggleLock(2)">🔓</button>
          </div>
          <button id="btn-2" class="btn btn-off" onclick="toggle(2)">OFF</button>
        </div>
        <div class="relay-box">
          <div class="relay-header">
            <span class="relay-title">🔌 Socket</span>
            <button id="lock-icon-3" class="btn-lock" onclick="toggleLock(3)">🔓</button>
          </div>
          <button id="btn-3" class="btn btn-off" onclick="toggle(3)">OFF</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const PASSCODE_ADMIN = "1234567890";
    const PASSCODE_GUEST = "GUEST123";

    const MQTT_HOST   = "wss://broker.hivemq.com:8884/mqtt";
    const TOPIC_CMD   = "hub_7f3b9c2a8e/cmd";
    const TOPIC_STATE = "hub_7f3b9c2a8e/state";
    const AUTH_TOKEN  = "sec_k8912xL90";

    let currentRole = "GUEST";
    let client = null;
    let lockStates = [false, false, false, false];
    let relayStates = [false, false, false, false];

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js'));
    }

    function handleLogin() {
      const entered = document.getElementById('pass-input').value;
      if (entered === PASSCODE_ADMIN) {
        currentRole = "ADMIN";
        sessionStorage.setItem('hub_role', 'ADMIN');
        showDashboard();
      } else if (entered === PASSCODE_GUEST) {
        currentRole = "GUEST";
        sessionStorage.setItem('hub_role', 'GUEST');
        showDashboard();
      } else {
        document.getElementById('login-error').style.display = 'block';
      }
    }

    function handleLogout() {
      sessionStorage.clear();
      if (client) client.end();
      location.reload();
    }

    function showDashboard() {
      document.getElementById('login-view').style.display = 'none';
      document.getElementById('dashboard-view').style.display = 'block';
      document.getElementById('user-role').innerText = currentRole;

      if (currentRole === "GUEST") {
        document.getElementById('admin-master').style.display = 'none';
        for (let i = 0; i < 4; i++) {
          document.getElementById('lock-icon-' + i).style.display = 'none';
        }
      }
      initMQTT();
    }

    function initMQTT() {
      client = mqtt.connect(MQTT_HOST, { clientId: 'SecWeb_' + Math.random().toString(16).substr(2, 8), clean: true });
      client.on('connect', () => {
        document.getElementById('hub-status').className = 'badge online';
        document.getElementById('hub-status').innerText = 'Cloud Connected';
        client.subscribe(TOPIC_STATE);
        sendCmd("GET_STATUS");
      });
      client.on('offline', () => {
        document.getElementById('hub-status').className = 'badge offline';
        document.getElementById('hub-status').innerText = 'Disconnected';
      });
      client.on('message', (topic, message) => {
        // Format: "R0:1:L0,R1:0:L1,R2:0:L0,R3:1:L0"
        const items = message.toString().split(',');
        items.forEach((item, idx) => {
          const parts = item.split(':');
          const isStateOn = parts[1] === '1';
          const isLocked = parts[2] === 'L1';
          relayStates[idx] = isStateOn;
          lockStates[idx] = isLocked;

          // Update lock buttons
          const lockBtn = document.getElementById('lock-icon-' + idx);
          if (lockBtn) lockBtn.innerText = isLocked ? '🔒' : '🔓';

          // Update relay action buttons
          const btn = document.getElementById('btn-' + idx);
          if (btn) {
            if (currentRole === 'GUEST' && isLocked) {
              btn.innerText = '🔒 Locked';
              btn.className = 'btn btn-locked';
              btn.disabled = true;
            } else {
              btn.innerText = isStateOn ? 'ON' : 'OFF';
              btn.className = isStateOn ? 'btn btn-on' : 'btn btn-off';
              btn.disabled = false;
            }
          }
        });
      });
    }

    function toggle(idx) {
      if (currentRole === 'GUEST' && lockStates[idx]) return;
      const btn = document.getElementById('btn-' + idx);
      btn.innerText = '⏳ Syncing...';
      btn.className = 'btn btn-wait';
      sendCmd('TOGGLE:' + idx);
    }

    function toggleLock(idx) {
      if (currentRole !== 'ADMIN') return;
      sendCmd('TOGGLE_LOCK:' + idx);
    }

    function sendCmd(cmd) {
      if (client && client.connected) {
        client.publish(TOPIC_CMD, `${AUTH_TOKEN}|${currentRole}|${cmd}`);
      }
    }

    window.onload = () => {
      const savedRole = sessionStorage.getItem('hub_role');
      if (savedRole) {
        currentRole = savedRole;
        showDashboard();
      }
    };
  </script>
</body>
</html>
